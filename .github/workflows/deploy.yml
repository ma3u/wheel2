name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config into index.html
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_CONFIG_B64 }}
        run: |
          echo "$FIREBASE_CONFIG_B64" | base64 -d > firebase-config.js
          python3 -c "
          with open('firebase-config.js') as f:
              config = f.read()
          with open('index.html') as f:
              html = f.read()
          marker = '// __FIREBASE_CONFIG_INJECT__ (replaced by CI/CD pipeline)'
          html = html.replace(marker, config)
          with open('index.html', 'w') as f:
              f.write(html)
          print('Config injected successfully')
          "


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
