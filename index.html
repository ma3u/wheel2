<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Names — Global AI Berlin</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2333;
            --accent-blue: #00b4d8;
            --accent-purple: #7c3aed;
            --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #00b4d8 100%);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-brand h1 {
            font-size: 1.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-brand .subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .badge {
            background: var(--accent-gradient);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* HOST VIEW */
        .host-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
        }

        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .wheel-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--accent-blue);
            z-index: 10;
            filter: drop-shadow(0 2px 8px rgba(0, 180, 216, 0.5));
        }

        #wheelCanvas {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.3), 0 0 80px rgba(0, 180, 216, 0.1);
        }

        .spin-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #qrCanvas {
            border-radius: 8px;
            background: white;
            padding: 8px;
        }

        .join-url {
            font-size: 0.75rem;
            color: var(--text-secondary);
            word-break: break-all;
            text-align: center;
        }

        .participants-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .participant-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease;
        }

        .participant-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-blue);
        }

        .participant-count {
            font-size: 2rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .winner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .winner-card {
            background: var(--bg-card);
            border: 2px solid transparent;
            border-image: var(--accent-gradient) 1;
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            animation: scaleIn 0.5s ease;
        }

        .winner-card h2 {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .winner-card .winner-name {
            font-size: 3rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }

        .winner-card button {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.75rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* PARTICIPANT VIEW */
        .join-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            gap: 2rem;
        }

        .join-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .join-card h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .join-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group input {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .input-group button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .input-group button:hover {
            transform: scale(1.02);
        }

        .join-success {
            text-align: center;
        }

        .join-success .checkmark {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .join-success h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .join-success p {
            color: var(--text-secondary);
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        /* Manual add section */
        .manual-add {
            display: flex;
            gap: 0.5rem;
        }

        .manual-add input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .manual-add input:focus {
            border-color: var(--accent-blue);
        }

        .manual-add button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .winner-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .winner-item .trophy {
            font-size: 1.1rem;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti 3s ease-in forwards;
            z-index: 1001;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .host-container {
                grid-template-columns: 1fr;
            }
            .wheel-wrapper {
                width: 350px;
                height: 350px;
            }
            #wheelCanvas {
                width: 350px;
                height: 350px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- HOST VIEW -->
    <div id="hostView" class="hidden">
        <header class="header">
            <div class="header-brand">
                <h1>Wheel of Names</h1>
                <span class="subtitle">Global AI Berlin — AgentCon 2026</span>
            </div>
            <div style="display:flex;align-items:center;gap:1rem;">
                <span class="badge" id="connectionStatus">Waiting for players...</span>
            </div>
        </header>
        <div class="host-container">
            <div class="wheel-section">
                <div class="wheel-wrapper">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
                </div>
                <button class="spin-btn" id="spinBtn" disabled>SPIN THE WHEEL</button>
            </div>
            <div class="sidebar">
                <div class="card">
                    <h3>Scan to Join</h3>
                    <div class="qr-container">
                        <canvas id="qrCanvas"></canvas>
                        <div class="join-url" id="joinUrl"></div>
                    </div>
                </div>
                <div class="card">
                    <h3>Participants <span class="participant-count" id="participantCount">0</span></h3>
                    <div class="manual-add">
                        <input type="text" id="manualName" placeholder="Add name manually..." />
                        <button id="manualAddBtn">Add</button>
                    </div>
                    <div style="margin-top:1rem;">
                        <div class="participants-list" id="participantsList"></div>
                    </div>
                </div>
                <div class="card" id="winnersCard" style="display:none;">
                    <h3>Winners</h3>
                    <div class="winners-list" id="winnersList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PARTICIPANT VIEW -->
    <div id="joinView" class="hidden">
        <div class="join-container">
            <div class="join-card">
                <h2>Join the Wheel!</h2>
                <p>AgentCon Berlin 2026 — Raffle</p>
                <div id="joinForm" class="input-group">
                    <input type="text" id="nameInput" placeholder="Enter your name" maxlength="30" autocomplete="off" />
                    <button id="joinBtn">Join the Raffle</button>
                </div>
                <div id="joinSuccess" class="join-success hidden">
                    <div class="checkmark">&#10003;</div>
                    <h3 id="welcomeName">Welcome!</h3>
                    <p><span class="status-dot"></span>You're in the raffle. Good luck!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- WINNER OVERLAY -->
    <div id="winnerOverlay" class="winner-overlay hidden">
        <div class="winner-card">
            <h2>And the winner is...</h2>
            <div class="winner-name" id="winnerName"></div>
            <button id="closeWinner">Continue</button>
        </div>
    </div>

    <script>
    // ============================================================
    // Wheel of Names — Global AI Berlin
    // Single-file TypeScript-style app using PeerJS for real-time
    // ============================================================

    const WHEEL_COLORS = [
        '#7c3aed', '#00b4d8', '#6366f1', '#06b6d4', '#8b5cf6',
        '#0891b2', '#a78bfa', '#0ea5e9', '#c084fc', '#38bdf8',
        '#818cf8', '#22d3ee', '#a855f7', '#67e8f9', '#6d28d9'
    ];

    /** @type {{ names: string[], winners: string[], peer: any, connections: any[], spinning: boolean, rotation: number }} */
    const state = {
        names: [],
        winners: [],
        peer: null,
        connections: [],
        spinning: false,
        rotation: 0
    };

    // Determine mode from URL
    const params = new URLSearchParams(window.location.search);
    const hostId = params.get('host');
    const isHost = !hostId;

    // ============ HOST MODE ============
    if (isHost) {
        document.getElementById('hostView').classList.remove('hidden');
        initHost();
    } else {
        document.getElementById('joinView').classList.remove('hidden');
        initParticipant(hostId);
    }

    function initHost() {
        // Create a PeerJS peer with a random ID
        const peerId = 'gai-wheel-' + Math.random().toString(36).substring(2, 8);
        state.peer = new Peer(peerId);

        state.peer.on('open', (id) => {
            console.log('Host peer ID:', id);
            generateQR(id);
            document.getElementById('connectionStatus').textContent = 'Room open';
        });

        state.peer.on('connection', (conn) => {
            conn.on('data', (data) => {
                if (data.type === 'join' && data.name) {
                    const sanitized = sanitizeName(data.name);
                    if (sanitized && !state.names.includes(sanitized)) {
                        state.names.push(sanitized);
                        updateParticipantsUI();
                        drawWheel();
                        broadcastState();
                    }
                }
            });
            conn.on('close', () => {
                state.connections = state.connections.filter(c => c !== conn);
            });
            state.connections.push(conn);
        });

        state.peer.on('error', (err) => {
            console.error('Peer error:', err);
            document.getElementById('connectionStatus').textContent = 'Connection error';
        });

        // Spin button
        document.getElementById('spinBtn').addEventListener('click', spinWheel);

        // Manual add
        document.getElementById('manualAddBtn').addEventListener('click', () => {
            const input = document.getElementById('manualName');
            const name = sanitizeName(input.value);
            if (name && !state.names.includes(name)) {
                state.names.push(name);
                input.value = '';
                updateParticipantsUI();
                drawWheel();
                broadcastState();
            }
        });

        document.getElementById('manualName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('manualAddBtn').click();
        });

        // Close winner overlay
        document.getElementById('closeWinner').addEventListener('click', () => {
            document.getElementById('winnerOverlay').classList.add('hidden');
        });

        drawWheel();
    }

    function sanitizeName(name) {
        return name.replace(/[<>&"'\/\\]/g, '').trim().substring(0, 30);
    }

    function generateQR(peerId) {
        const baseUrl = window.location.origin + window.location.pathname;
        const joinUrl = baseUrl + '?host=' + encodeURIComponent(peerId);
        document.getElementById('joinUrl').textContent = joinUrl;

        QRCode.toCanvas(document.getElementById('qrCanvas'), joinUrl, {
            width: 200,
            margin: 1,
            color: { dark: '#0d1117', light: '#ffffff' }
        });
    }

    function updateParticipantsUI() {
        const count = state.names.length;
        document.getElementById('participantCount').textContent = count.toString();
        document.getElementById('spinBtn').disabled = count < 2;

        const list = document.getElementById('participantsList');
        list.innerHTML = state.names.map(name =>
            `<div class="participant-item"><span class="dot"></span>${escapeHtml(name)}</div>`
        ).join('');

        document.getElementById('connectionStatus').textContent = `${count} player${count !== 1 ? 's' : ''} joined`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function drawWheel() {
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 500, cy = 500, radius = 480;
        const names = state.names;

        ctx.clearRect(0, 0, 1000, 1000);

        if (names.length === 0) {
            // Empty state
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#1c2333';
            ctx.fill();
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#8b949e';
            ctx.font = '28px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Waiting for players...', cx, cy);
            return;
        }

        const sliceAngle = (2 * Math.PI) / names.length;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(state.rotation);
        ctx.translate(-cx, -cy);

        for (let i = 0; i < names.length; i++) {
            const startAngle = i * sliceAngle;
            const endAngle = startAngle + sliceAngle;

            // Draw slice
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw text
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(startAngle + sliceAngle / 2);
            ctx.fillStyle = '#ffffff';
            const fontSize = Math.min(24, Math.max(12, 600 / names.length));
            ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(names[i], radius - 20, 0);
            ctx.restore();
        }

        ctx.restore();

        // Center circle
        ctx.beginPath();
        ctx.arc(cx, cy, 40, 0, 2 * Math.PI);
        ctx.fillStyle = var_bg_primary();
        ctx.fill();
        ctx.strokeStyle = '#30363d';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function var_bg_primary() { return '#0d1117'; }

    function spinWheel() {
        if (state.spinning || state.names.length < 2) return;
        state.spinning = true;
        document.getElementById('spinBtn').disabled = true;

        const totalRotation = (Math.random() * 5 + 8) * Math.PI * 2; // 8-13 full rotations
        const duration = 5000 + Math.random() * 2000;
        const startRotation = state.rotation;
        const startTime = performance.now();

        function animate(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Easing: cubic ease-out
            const eased = 1 - Math.pow(1 - progress, 3);
            state.rotation = startRotation + totalRotation * eased;

            drawWheel();

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                state.spinning = false;
                document.getElementById('spinBtn').disabled = false;
                announceWinner();
            }
        }

        requestAnimationFrame(animate);
    }

    function announceWinner() {
        const names = state.names;
        const sliceAngle = (2 * Math.PI) / names.length;

        // The pointer is at the top (3π/2 or -π/2 from the positive x-axis)
        // Normalize rotation
        const normalizedRotation = ((state.rotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        // The winning slice is under the pointer at the top
        const pointerAngle = (2 * Math.PI - normalizedRotation + 3 * Math.PI / 2) % (2 * Math.PI);
        const winnerIndex = Math.floor(pointerAngle / sliceAngle) % names.length;
        const winner = names[winnerIndex];

        state.winners.push(winner);
        state.names = state.names.filter((_, i) => i !== winnerIndex);

        // Show winner overlay
        document.getElementById('winnerName').textContent = winner;
        document.getElementById('winnerOverlay').classList.remove('hidden');
        showConfetti();

        // Update winners list
        const winnersCard = document.getElementById('winnersCard');
        winnersCard.style.display = 'block';
        const winnersList = document.getElementById('winnersList');
        winnersList.innerHTML = state.winners.map((w, i) =>
            `<div class="winner-item"><span class="trophy">&#127942;</span> #${i + 1} ${escapeHtml(w)}</div>`
        ).join('');

        updateParticipantsUI();
        drawWheel();
        broadcastState();
    }

    function showConfetti() {
        const colors = ['#7c3aed', '#00b4d8', '#6366f1', '#06b6d4', '#22c55e', '#f59e0b', '#ef4444'];
        for (let i = 0; i < 50; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + 'vw';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDelay = Math.random() * 0.5 + 's';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 3500);
        }
    }

    function broadcastState() {
        const data = { type: 'state', names: state.names, winners: state.winners };
        state.connections.forEach(conn => {
            if (conn.open) conn.send(data);
        });
    }

    // ============ PARTICIPANT MODE ============
    function initParticipant(hostPeerId) {
        const joinBtn = document.getElementById('joinBtn');
        const nameInput = document.getElementById('nameInput');

        joinBtn.addEventListener('click', () => {
            const name = sanitizeName(nameInput.value);
            if (!name) return;

            joinBtn.disabled = true;
            joinBtn.textContent = 'Connecting...';

            const peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(hostPeerId, { reliable: true });
                conn.on('open', () => {
                    conn.send({ type: 'join', name: name });
                    document.getElementById('joinForm').classList.add('hidden');
                    document.getElementById('joinSuccess').classList.remove('hidden');
                    document.getElementById('welcomeName').textContent = `Welcome, ${escapeHtml(name)}!`;
                });
                conn.on('error', () => {
                    joinBtn.disabled = false;
                    joinBtn.textContent = 'Retry';
                });
            });
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                joinBtn.disabled = false;
                joinBtn.textContent = 'Retry';
            });
        });

        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });
    }
    </script>
</body>
</html>
